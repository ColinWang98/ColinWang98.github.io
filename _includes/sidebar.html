{% if page.author_profile or layout.author_profile or page.sidebar %}
  <div class="sidebar sticky">
    <div class="profile_box">
      <div class="author__avatar">
        <img src="{{ site.author.avatar | relative_url }}" alt="Avatar">
      </div>
      <div class="author__content">
        <h3 class="author__name">{{ site.author.name }}</h3>
        <p class="author__bio">{{ site.author.bio }}</p>
      </div>
      <div class="author__urls-wrapper">
        <ul class="author__urls social-icons">
          <li class="icon-only" title="Location: {{ site.author.location }}"><i class="fas fa-fw fa-map-marker-alt" aria-hidden="true"></i></li>
          <li class="icon-only" title="Email: {{ site.author.email }}"><a href="mailto:{{ site.author.email }}"><i class="fas fa-fw fa-envelope" aria-hidden="true"></i></a></li>
          <li class="icon-only" title="Phone: {{ site.author.tel }}"><a href="tel:{{ site.author.tel }}"><i class="fas fa-fw fa-phone" aria-hidden="true"></i></a></li>
          <li class="icon-only" title="ORCID"><a href="{{ site.author.orcid }}" target="_blank"><i class="ai ai-orcid-square ai-fw"></i></a></li>
        </ul>
      </div>
    </div>
    <div class="cv-download">
      <a href="{{ '/assets/Wang Yao CV.pdf' | absolute_url }}" class="btn btn--cv" target="_blank">
        <i class="fas fa-fw fa-download" aria-hidden="true"></i> Download CV
      </a>
    </div>
  </div>
{% endif %}
