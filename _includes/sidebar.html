{% if page.author_profile or layout.author_profile or page.sidebar %}
  <div class="sidebar sticky">
    <div class="profile_box">
      <div class="author__avatar is-interactive js-easter-egg-trigger">
        <img src="{{ site.author.avatar | relative_url }}" alt="Avatar">
        <div class="click-me-hint">
          <svg class="click-me-curve" viewBox="0 0 100 50" xmlns="http://www.w3.org/2000/svg">
            <path d="M10,25 Q25,10 50,25 T90,25" stroke="var(--accent)" stroke-width="2" fill="none" class="curve-path"/>
            <text x="50" y="15" text-anchor="middle" class="click-me-text">click me</text>
          </svg>
        </div>
      </div>
      <div class="author__content">
        <h3 class="author__name">{{ site.author.name }}</h3>
        <p class="author__bio">{{ site.author.bio }}</p>
      </div>
      <div class="author__urls-wrapper">
        <button class="btn btn--glass author__menu-toggle" type="button">
          Contact
          <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
        </button>
        <ul class="author__urls social-icons">
          <li class="icon-only" title="Location: {{ site.author.location }}"><i class="fa-solid fa-location-dot" aria-hidden="true"></i></li>
          <li class="icon-only" title="Email: {{ site.author.email }}"><a href="mailto:{{ site.author.email }}"><i class="fa-solid fa-envelope" aria-hidden="true"></i></a></li>
          <li class="icon-only" title="Phone: {{ site.author.tel }}"><a href="tel:{{ site.author.tel }}"><i class="fa-solid fa-phone" aria-hidden="true"></i></a></li>
          <li class="icon-only" title="ORCID"><a href="{{ site.author.orcid }}" target="_blank" rel="noopener noreferrer"><i class="ai ai-orcid-square ai-fw" aria-hidden="true"></i></a></li>
        </ul>
      </div>
    </div>
    <div class="cv-download">
      <a href="{{ '/assets/Wang Yao CV.pdf' | absolute_url }}" class="btn btn--cv" target="_blank" rel="noopener noreferrer">
        <i class="fas fa-fw fa-download" aria-hidden="true"></i> Download CV
      </a>
    </div>
  </div>
{% endif %}
