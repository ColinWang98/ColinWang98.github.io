{% if page.author_profile or layout.author_profile or page.sidebar %}
  <div class="sidebar sticky">
    <div class="profile_box">
      <div class="author__avatar">
        <img src="{{ site.author.avatar | relative_url }}" alt="Avatar" id="egg-avatar" style="cursor:pointer;z-index:50;position:relative;pointer-events:auto;">
      </div>
      <div class="author__content">
        <h3 class="author__name">{{ site.author.name }}</h3>
        <p class="author__bio">{{ site.author.bio }}</p>
      </div>
      <div class="author__urls-wrapper">
        <ul class="author__urls social-icons">
          <li class="icon-only" title="Location: {{ site.author.location }}"><i class="fa-solid fa-location-dot" aria-hidden="true"></i></li>
          <li class="icon-only" title="Email: {{ site.author.email }}"><a href="mailto:{{ site.author.email }}"><i class="fa-solid fa-envelope" aria-hidden="true"></i></a></li>
          <li class="icon-only" title="Phone: {{ site.author.tel }}"><a href="tel:{{ site.author.tel }}"><i class="fa-solid fa-phone" aria-hidden="true"></i></a></li>
          <li class="icon-only" title="ORCID"><a href="{{ site.author.orcid }}" target="_blank"><i class="ai ai-orcid-square ai-fw" aria-hidden="true"></i></a></li>
        </ul>
      </div>
    </div>
    <div class="cv-download">
      <a href="{{ '/assets/Wang Yao CV.pdf' | absolute_url }}" class="btn btn--cv" target="_blank">
        <i class="fas fa-fw fa-download" aria-hidden="true"></i> Download CV
      </a>
    </div>
  </div>
{% endif %}
<script>
document.addEventListener('DOMContentLoaded', function() {
  console.log('侧边栏DOM加载完成，开始设置彩蛋');
  
  if(!document.getElementById('bg-automaton-egg')){
    var iframe = document.createElement('iframe');
    iframe.src = '{{ site.baseurl }}/images/cellular-automaton-animation.html';
    iframe.id = 'bg-automaton-egg';
    iframe.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:9999;pointer-events:none;opacity:0;transition:opacity 0.8s;background:transparent;';
    document.body.appendChild(iframe);
    console.log('侧边栏iframe已创建:', iframe);
  }
  
  var avatar = document.getElementById('egg-avatar');
  var bg = document.getElementById('bg-automaton-egg');
  var show = false;
  
  console.log('侧边栏头像元素:', avatar);
  console.log('侧边栏背景元素:', bg);
  
  if(avatar && bg){
    avatar.addEventListener('click',function(e){
      console.log('侧边栏头像被点击');
      show = !show;
      bg.style.opacity = show ? 1 : 0;
      console.log('侧边栏背景透明度设置为:', bg.style.opacity);
      e.stopPropagation();
    });
    
    document.body.addEventListener('click',function(e){
      if(show && e.target!==avatar && !avatar.contains(e.target)){
        bg.style.opacity = 0;
        show = false;
        console.log('侧边栏点击其他地方，关闭彩蛋');
      }
    });
  } else {
    console.log('侧边栏未找到头像或背景元素');
  }
});
</script>
